name: ServerLink
version: 1.0.2
main: com.serverlink.Main
api-version: 1.21
load: STARTUP

commands:
  serverlink:
    description: ServerLink main command
  server:
    description: Quick transfer
  servertransfer:
    description: Force transfer player

permissions:
  serverlink.help:
    description: View help
    default: true
  serverlink.connect:
    description: Transfer self
    default: true
  serverlink.list:
    description: List servers
    default: true
  serverlink.add:
    description: Add server
    default: op
  serverlink.remove:
    description: Remove server
    default: op
  serverlink.reload:
    description: Reload plugin
    default: op
  serverlink.admin.transfer:
    description: Force transfer other player
    default: op