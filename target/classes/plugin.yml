name: ServerLink
version: 1.0.2
main: com.serverlink.Main
api-version: 1.21
load: POSTWORLD
folia-supported: true

commands:
  serverlink:
    description: ServerLink main command
    usage: /serverlink <help|connect|reload|add|remove|list>
    aliases: [sl]
  server:
    description: Quick transfer command
    usage: /server <server-name>
  servertransfer:
    description: Force transfer player
    usage: /servertransfer <player> <server>

permissions:
  serverlink.help:
    default: true
  serverlink.connect:
    default: true
  serverlink.list:
    default: true
  serverlink.reload:
    default: op
  serverlink.add:
    default: op
  serverlink.remove:
    default: op
  serverlink.admin.transfer:
    description: Force transfer other player
    default: op